# Same as `templates/sources.config.yaml` — copy to project root as `sources.config.yaml`.
# On `aistack init`, this file is created automatically when missing.

version: 1
cacheTtlSeconds: 3600
cacheDir: .cache/aistack
githubMetadataEnrichMax: 120
githubMetadataEnrichConcurrency: 8

sources:
  - type: github
    id: awesome-copilot
    repo: github/awesome-copilot
    path: skills
    branch: main

  - type: github
    id: awesome-copilot-hooks
    repo: github/awesome-copilot
    path: hooks
    branch: main
    moduleType: hook

  - type: github
    id: awesome-copilot-agents
    repo: github/awesome-copilot
    path: agents
    branch: main
    moduleType: subagent

  - type: github
    id: anthropic-skills
    repo: anthropics/skills
    path: skills
    branch: main

  - type: github
    id: composio-awesome-claude-skills
    repo: ComposioHQ/awesome-claude-skills
    path: ""
    branch: master

  - type: github
    id: microsoft-skills
    repo: microsoft/skills
    path: .github/skills
    branch: main

  - type: github
    id: microsoft-azure-skills
    repo: microsoft/azure-skills
    path: skills
    branch: main

  - type: github
    id: openai-skills
    repo: openai/skills
    path: skills/.curated
    branch: main

  - type: github
    id: google-skills-cloud
    repo: google/skills
    path: skills/cloud
    branch: main
