# Skill catalog sources — registry aggregates these; do not list individual skills here.
# Copy to project root as `sources.config.yaml` (or set AISTACK_SOURCES_CONFIG).
#
# GitHub REST listing: set GITHUB_TOKEN for higher rate limits (and private repos).
# Description enrichment uses raw.githubusercontent.com (bounded; see githubMetadataEnrichMax).

version: 1
cacheTtlSeconds: 3600
cacheDir: .cache/aistack

# Max parallel raw fetches per GitHub source per cache refresh (0 = synthetic descriptions only).
githubMetadataEnrichMax: 120
githubMetadataEnrichConcurrency: 8

sources:
  - type: github
    id: awesome-copilot
    repo: github/awesome-copilot
    path: skills
    branch: main
    # Optional per-source overrides:
    # enrich: false
    # enrichMax: 80

  - type: github
    id: anthropic-skills
    repo: anthropics/skills
    path: skills
    branch: main

  # npm: list skills/ inside a published package tarball (one registry download per cache TTL).
  # - type: npm
  #   id: my-org-skills
  #   package: "@myorg/skills-bundle"
  #   path: skills
  #   version: latest
  #   registryUrl: https://registry.npmjs.org
