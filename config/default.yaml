# Ai Stack Kit Default Configuration
version: "1.0"

settings:
  cacheDir: ~/.aistack/cache
  lockFile: .aistack/lock.yaml
  autoSync: false
  parallelDownloads: 5
  retryAttempts: 3
  timeout: 30000

registries:
  - name: default
    url: https://registry.aistack.dev

sources:
  - type: github
    name: official
    repository: aistack/skills
    branch: main

ide:
  type: cursor
  features:
    - skills
    - rules
    - hooks

skills: []
