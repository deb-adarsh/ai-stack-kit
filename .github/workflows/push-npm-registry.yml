# Pushes the CLI to registry.npmjs.org as the unscoped public package **`ai-stack-kit`**.
# Repo **`package.json`** stays **`@deb-adarsh/ai-stack-kit`** for GitHub Packages — CI rewrites `name` only for this job.
#
# Authentication: Trusted publishing (OIDC) — no **`NPM_TOKEN`**.
# npm → package **`ai-stack-kit`** → Settings → Trusted Publisher → GitHub Actions:
#   organization/user, repository, workflow filename **`push-npm-registry.yml`** must match exactly (case-sensitive).
# Requires npm CLI ≥ 11.5.1 and Node ≥ 22.14 — https://docs.npmjs.com/trusted-publishers
# Optional: after verifying OIDC publishes, restrict package Settings → Publishing access (tokens) per npm docs.
name: Push CLI to npm registry

on:
  push:
    branches: ["main"]
    paths:
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "templates/**"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC for npm Trusted Publishers

jobs:
  push:
    runs-on: ubuntu-latest
    # Trusted Publisher on npm is wired to this upstream repo; forks cannot publish as you.
    if: github.repository == 'deb-adarsh/ai-stack-kit'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js for npm registry
        uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm CLI for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Push to npm registry (ai-stack-kit, OIDC)
        run: |
          NPMJS_PKG="ai-stack-kit"
          VER="$(node -p "require('./package.json').version")"
          REG="https://registry.npmjs.org"

          set +e
          npm view "${NPMJS_PKG}@${VER}" version --registry="${REG}" >/dev/null 2>&1
          HAS_RC=$?
          set -e
          if [ "$HAS_RC" -eq 0 ]; then
            echo "Skip push — ${NPMJS_PKG}@${VER} already exists on npm registry."
            exit 0
          fi

          npm pkg set "name=${NPMJS_PKG}"
          npm pkg delete publishConfig 2>/dev/null || true

          echo "Publishing via Trusted Publishers (OIDC) → ${NPMJS_PKG}@${VER}"
          npm publish --access public --registry="${REG}"
