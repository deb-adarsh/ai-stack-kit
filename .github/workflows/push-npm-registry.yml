# Pushes the CLI to registry.npmjs.org as the unscoped public package `ai-stack-kit`.
# Repo package.json stays `@deb-adarsh/ai-stack-kit` for GitHub Packages — CI rewrites `name` only for this job.
#
# Repo secret NPM_TOKEN — use a Granular Access Token with publish permission and
# "bypass two-factor authentication" for automation so CI never prompts for OTP (avoids EOTP).
# If publish succeeds with whoami but returns E403 Forbidden, the token cannot publish THIS package —
# granular scopes often omit unscoped names; grant Publish on **ai-stack-kit** or **All packages**.
# See: https://docs.npmjs.com/creating-and-viewing-access-tokens
#      https://docs.npmjs.com/creating-and-publishing-unscoped-public-packages
# Optional later: after the package exists on npm, switch to Trusted Publishers + OIDC and revoke NPM_TOKEN:
# https://docs.npmjs.com/trusted-publishers
name: Push CLI to npm registry

on:
  push:
    branches: ["main"]
    paths:
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "templates/**"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js for npm registry
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Push to npm registry (ai-stack-kit)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "Skipping npm registry push — add repo secret NPM_TOKEN (granular token, publish + bypass 2FA for automation)."
            exit 0
          fi

          NPMJS_PKG="ai-stack-kit"
          VER="$(node -p "require('./package.json').version")"
          REG="https://registry.npmjs.org"

          set +e
          npm view "${NPMJS_PKG}@${VER}" version --registry="${REG}" >/dev/null 2>&1
          HAS_RC=$?
          set -e
          if [ "$HAS_RC" -eq 0 ]; then
            echo "Skip push — ${NPMJS_PKG}@${VER} already exists on npm registry."
            exit 0
          fi

          npm pkg set "name=${NPMJS_PKG}"
          npm pkg delete publishConfig 2>/dev/null || true

          # Explicit registry auth (avoids relying on setup-node timing vs publish-only env)
          npm config set "//registry.npmjs.org/:_authToken" "${NODE_AUTH_TOKEN}"

          echo "Publishing as npm user:"
          npm whoami --registry="${REG}"

          npm publish --access public --registry="${REG}"
